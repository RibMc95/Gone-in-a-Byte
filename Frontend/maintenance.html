<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Down for Maintenance | Gone in a Bitee</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=block" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-wrap {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1rem;
        }
        .error-card { max-width: 500px; }
        .error-icon { font-size: 3.5rem; margin-bottom: 0.5rem; }
        .error-logo { font-size: 1.75rem; margin-bottom: 1.5rem; }
        .error-card p { line-height: 1.6; opacity: 0.85; margin: 1rem 0; }
        .error-contact { font-size: 0.9rem; opacity: 0.7; margin-top: 2rem; }
    </style>
</head>

<body>
    <div class="error-wrap">
        <div class="error-card">
            <p class="limelight-regular error-logo">Gone in a Bitee 🍪</p>
            <div class="error-icon">🔧</div>
            <h2>We'll Be Right Back</h2>
            <p>
                Our site is down for a little maintenance while we make things better.
                Please check back again soon — thanks for your patience!
            </p>
            <p class="error-contact">
                Questions? Reach us at Goneinabitee@gmail.com or (470)-420-8559.
            </p>
        </div>
    </div>
</body>

</html>

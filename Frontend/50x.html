<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Went Wrong | Gone in a Bitee</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=block" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-wrap {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1rem;
        }
        .error-card { max-width: 480px; }
        .error-code { font-size: 4rem; font-weight: 700; margin: 0; }
        .error-logo { font-size: 1.5rem; margin-bottom: 1.5rem; }
        .error-card p { line-height: 1.6; opacity: 0.85; margin: 1rem 0 1.75rem; }
        .error-btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: #006aff;
            color: #fff;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
        }
        .error-btn:hover { background: #0052cc; }
    </style>
</head>

<body>
    <div class="error-wrap">
        <div class="error-card">
            <p class="limelight-regular error-logo">Gone in a Bitee 🍪</p>
            <p class="error-code">500</p>
            <h2>Something Went Wrong</h2>
            <p>We hit an unexpected error on our end. Please try again in a few moments.</p>
            <a href="/" class="error-btn">Back to Home</a>
        </div>
    </div>
</body>

</html>
